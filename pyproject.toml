[project]
name = "neuroicu-tts-addon"
version = "3.0.0"
description = "Anki add-on that synthesizes Neuro ICU explanation audio with F5-TTS"
requires-python = ">=3.9"

[tool.ruff]
line-length = 200
target-version = "py39"
# addon/ is the source of truth; neuroicu_tts_addon/ is generated by tools/package.py.
exclude = ["neuroicu_tts_addon", ".beads", "packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = [
  "E501",   # long lines are pre-existing style in main.py/control_center.py
  "E701",   # same: compound statements on one line
  "E702",
  "SIM105", # contextlib.suppress is not clearer in the Qt teardown paths
  "SIM401", # note["Extra"] vs note.get(): Anki Note duck-typing is deliberate
  "E401",   # main.py deliberately groups its stdlib imports on one line
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"addon/test_*.py" = ["E402"]
